[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Local-first, citation-backed RAG API with Ollama and Qdrant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "qdrant-client>=1.17,<1.18", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3", "pypdf>=5,<7", "python-multipart>=0.0.9,<1", "python-docx==1.2.0", "striprtf==0.0.29", "python-pptx==1.0.2", "openpyxl==3.1.5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.3"]
documents = ["unstructured[all-docs]>=0.16,<1"]
parser-tests = [
    "unstructured[pdf]==0.18.32",
    "unstructured-inference==1.6.17",
    "pdfminer.six==20260107",
    "pypdf==6.21.4",
    "nltk==3.10.4",
    "reportlab==4.4.4",
    "Markdown==3.11.2",
    "lxml==6.1.3",
    "beautifulsoup4==4.15.0",
    "html5lib==1.1",
    "charset-normalizer==3.5.2",
    "filetype==1.2.0",
    "python-magic==0.4.27",
    "langdetect==1.0.9",
]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = ["documents: optional real Unstructured parser/chunker tests (explicit opt-in)"]
[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
rag = ["web/*.html", "web/*.css", "web/*.js"]
