[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Local-first, citation-backed RAG API with Ollama and Qdrant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "qdrant-client>=1.12,<2", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3", "pypdf>=5,<7", "python-multipart>=0.0.9,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]
documents = ["unstructured[all-docs]>=0.16,<1"]
parser-tests = [
    "unstructured[pdf]==0.18.32",
    "unstructured-inference==1.6.17",
    "pdfminer.six==20260107",
    "pypdf==6.21.4",
    "nltk==3.10.4",
    "reportlab==4.4.4",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["documents: optional real Unstructured parser/chunker tests (explicit opt-in)"]
[tool.ruff]
line-length = 100
