# CI protocol smoke only: deliberately replaces Ollama with a deterministic fixture.
services:
  api:
    environment:
      RAG_MODEL_MODE: synthetic
      OLLAMA_URL: http://ollama-stub:11434
      INGEST_SOURCE_ROOTS: '{"fixture-root":"/sources/fixtures"}'
    volumes:
      - ./demo/fixtures:/sources/fixtures:ro
    depends_on:
      - ollama-stub
  ollama-stub:
    image: enterprise-rag-platform:folder-ui-v1
    command: [python, /app/demo/ollama_stub.py]
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',11434),2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15
