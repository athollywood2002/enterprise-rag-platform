name: rag-text-csv-demo
services:
  api:
    image: enterprise-rag-platform:folder-ui-v1
    build: .
    init: true
    environment:
      RAG_MODEL_MODE: ${RAG_MODEL_MODE:-unknown}
      API_KEY: ${RAG_API_KEY:?Set RAG_API_KEY in .env.demo}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: rag_text_csv_demo_v1
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_NUM_PREDICT: "1536"
      OLLAMA_THINK: "${OLLAMA_THINK:-default}"
      NO_PROXY: qdrant,ollama-stub,localhost,127.0.0.1,host.docker.internal
    ports:
      - "${RAG_BIND_IP:-127.0.0.1}:${RAG_PORT:-18000}:8000"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - qdrant
    volumes:
      - library-state:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  qdrant:
    image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    volumes:
      - demo-qdrant:/qdrant/storage
    # No host ports, external volume, or existing collection connection.
volumes:
  demo-qdrant:
  library-state:
