name: installer-synthetic
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]' playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_installer.py
      - run: bash -n setup.sh
      - name: Isolated installer lifecycle and browser; stub model, no weights
        run: |
          export INSTALLER_FIXTURE_DIR="$HOME/rag-installer-fixture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/install_synthetic_check.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: installer-synthetic-result
          path: ~/rag-installer-fixture-*/result.json
