name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check --diff .
      - name: Verify optional parser is absent in the base-only job
        run: python -c "from importlib.util import find_spec; assert find_spec('unstructured') is None"
      - run: python -m pytest -q
  document-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUTO_DOWNLOAD_NLTK: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NLTK_DATA: ${{ github.workspace }}/.venv/nltk_data
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      # Avoid downloading CUDA runtimes for this text-only PDF test job.
      - run: pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev,parser-tests]'
      # Explicit setup-time downloads, never automatic downloads inside tests.
      - run: python -m nltk.downloader -d "$NLTK_DATA" punkt_tab averaged_perceptron_tagger_eng
      - run: python -m pytest -q --run-document-tests
  test-portability-macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Installer tests with default API port occupied
        run: |
          python - <<'PY'
          import socket
          import subprocess
          import sys

          assert sys.platform == "darwin"
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 18000))
              listener.listen(1)
              subprocess.run(
                  [sys.executable, "-m", "pytest", "--noconftest", "-q", "tests/test_installer.py"],
                  check=True,
              )
          PY
      - name: Cross-platform Office parsers and Linux-only integration selection
        run: python -m pytest -q -rs tests/test_office_formats.py tests/test_word_rtf_regressions.py tests/test_parser_correction_migration.py tests/test_xlsx_visibility.py tests/test_table_quality.py tests/test_answer_context.py tests/test_collection_fusion.py
